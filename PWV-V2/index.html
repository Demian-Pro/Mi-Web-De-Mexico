<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Cultura e Historia de México</title>
  <style>
    :root {
      --verde: #0f5132;
      --verde-claro: #198754;
      --rojo: #b02a37;
      --fondo: #f4f6f8;
      --blanco: #ffffff;
      --texto: #212529;
      --gris-texto: #555555;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0a3622, #198754);
      color: var(--texto);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-card {
      background: var(--blanco);
      width: 100%;
      max-width: 440px;
      padding: 40px 35px;
      border-radius: 16px;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.25);
      border-top: 6px solid var(--rojo);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-header h1 {
      margin: 0 0 8px 0;
      color: var(--verde);
      font-size: 1.85rem;
    }

    .auth-header p {
      margin: 0;
      color: var(--gris-texto);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--texto);
      font-size: 0.92rem;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ced4da;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--verde-claro);
      box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.15);
    }

    .btn-submit {
      width: 100%;
      background-color: var(--verde);
      color: var(--blanco);
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background-color: #0a3622;
    }

    .error-msg {
      color: var(--rojo);
      font-size: 0.88rem;
      margin-top: 10px;
      text-align: center;
      display: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <h1>Bienvenido a México</h1>
      <p>Regístrate para explorar nuestra cultura, música, historia y tradiciones</p>
    </div>

    <form id="registroForm">
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" placeholder="Ej. Sofía Hernández" required>
      </div>

      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" placeholder="correo@ejemplo.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Mínimo 4 caracteres" minlength="4" required>
      </div>

      <button type="submit" class="btn-submit">Registrarme y Entrar →</button>
      <div id="errorMsg" class="error-msg">Por favor completa todos los campos obligatorios.</div>
    </form>
  </div>

  <script>
    document.getElementById('registroForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value.trim();
      const correo = document.getElementById('correo').value.trim();

      if (!nombre || !correo) {
        document.getElementById('errorMsg').style.display = 'block';
        return;
      }

      localStorage.setItem('usuarioMexicoNombre', nombre);
      localStorage.setItem('usuarioMexicoCorreo', correo);

      window.location.href = 'centro.html';
    });
  </script>

</body>
</html>
