<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registro</title>
    <style>
        body {
            background-color: #e3ece4;
            font-family: sans-serif;
            padding: 20px;
        }
        button {
            background-color: #cbdccb;
            border: 1px solid #a4bfa4;
            padding: 4px 10px;
            cursor: pointer;
        }
        .error {
            color: #ba2323;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>Registro</h1>

    <div>
        <p>
            <label for="usuario">Usuario:</label><br>
            <input type="text" id="usuario" name="usuario">
        </p>
        
        <p>
            <label for="contrasena">Contraseña:</label><br>
            <input type="password" id="contrasena" name="contrasena">
        </p>

        <button onclick="validarRegistro()">Registrarse</button>
        
        <div id="mensajeAlerta" class="error"></div>
    </div>

    <script>
        function validarRegistro() {
            var usuario = document.getElementById('usuario').value;
            var contrasena = document.getElementById('contrasena').value;
            var alerta = document.getElementById('mensajeAlerta');

            if (usuario.trim() === "" || contrasena.trim() === "") {
                alerta.textContent = "Por favor, llena ambos campos para registrarte.";
            } else {
                alerta.textContent = ""; 
                window.location.href = 'mexico.html';
            }
        }
    </script>

</body>
</html>
