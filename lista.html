<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estaciones y Meses</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent: #00ffcc;
            --text: #c9d1d9;
            --text-bright: #ffffff;
            --border: #30363d;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
        }
        h1 { color: var(--text-bright); text-transform: uppercase; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-top: 20px; }
        ol { padding-left: 20px; }
        li { margin: 8px 0; font-size: 1.1rem; color: var(--text); }
        .btn-nav {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            border: 2px solid var(--accent);
            color: var(--accent);
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-nav:hover { background-color: var(--accent); color: var(--bg-color); box-shadow: 0 0 15px var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Estaciones del año</h1>
        <ol>
            <li>Primavera</li><li>Verano</li><li>Otono</li><li>Invierno</li>
        </ol>
        
        <h1>Meses del año</h1>
        <ol>
            <li>Enero</li><li>Febrero</li><li>Marzo</li><li>Abril</li><li>Mayo</li><li>Junio</li>
            <li>Julio</li><li>Agosto</li><li>Septiembre</li><li>Octubre</li><li>Noviembre</li><li>Diciembre</li>
        </ol>
        <div style="text-align: center;">
            <a href="index.html" class="btn-nav">voy a la pagina principal</a>
        </div>
    </div>
</body>
</html>
