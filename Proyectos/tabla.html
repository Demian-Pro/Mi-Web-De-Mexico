<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Amigos</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent: #00ffcc;
            --text: #c9d1d9;
            --text-bright: #ffffff;
            --border: #30363d;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
        }
        h1 {
            color: var(--text-bright);
            text-align: center;
            text-transform: uppercase;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            color: var(--accent);
            font-weight: 600;
        }
        tr:hover {
            background-color: rgba(255,255,255,0.02);
        }
        .btn-nav {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            border: 2px solid var(--accent);
            color: var(--accent);
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-nav:hover {
            background-color: var(--accent);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--accent);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Amigos</h1>
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Apellido Paterno</th>
                    <th>Apellido Materno</th>
                    <th>Edad</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>Jesus Eduardo</td><td>Calva</td><td>Rivera</td><td>16</td></tr>
                <tr><td>Luis Enrique</td><td>Ceron</td><td>Bravo</td><td>17</td></tr>
                <tr><td>Sebastian Alexis</td><td>Ortiz</td><td>Olvera</td><td>17</td></tr>
                <tr><td>Javier</td><td>Hernandez</td><td>Balcazar</td><td>40</td></tr>
                <tr><td>Demian</td><td>Ramirez</td><td>Trejo</td><td>16</td></tr>
            </tbody>
        </table>
        <div style="text-align: center;">
            <a href="index.html" class="btn-nav">voy a la pagina principal</a>
        </div>
    </div>
</body>
</html>
